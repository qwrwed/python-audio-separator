name: run-unit-tests

on:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'audio_separator/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'

  test-ubuntu:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true # caching dependencies from uv.lock

      - name: Install uv dependencies (CPU)
        run: uv sync --locked --extra cpu

      - name: Run unit tests with coverage
        run: uv run pytest tests/unit

  test-macos:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: macos-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true # caching dependencies from uv.lock

      - name: Install uv dependencies (CPU)
        # Large wheels intermittently fail mid-download on hosted macOS runners,
        # so retry the install; completed downloads are reused from the cache.
        run: |
          n=0
          until uv sync --locked --extra cpu; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then exit 1; fi
            echo "uv sync failed; retry $n/2 in 15s"
            sleep 15
          done

      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/unit

  test-windows:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true # caching dependencies from uv.lock

      - name: Install uv dependencies (CPU)
        run: uv sync --locked --extra cpu

      - name: Run unit tests with coverage
        run: uv run pytest tests/unit

  # Gate job for branch protection - always reports a status
  unit-tests:
    needs: [changes, test-ubuntu, test-macos, test-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.changes.outputs.should_run }}" != "true" ]]; then
            echo "Tests skipped - no code changes detected"
            exit 0
          fi
          if [[ "${{ needs.test-ubuntu.result }}" == "failure" ]] || \
             [[ "${{ needs.test-macos.result }}" == "failure" ]] || \
             [[ "${{ needs.test-windows.result }}" == "failure" ]]; then
            echo "Some tests failed"
            exit 1
          fi
          echo "All tests passed"
