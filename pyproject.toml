# [project] publishes broad runtime dependency markers while
# [tool.uv] constraint-dependencies keep the narrower cross-platform lock used by contributors.
[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name = "audio-separator"
version = "0.47.1"
description = "Easy to use audio stem separation, using various models from UVR trained primarily by @Anjok07"
authors = [{ name = "Andrew Beveridge", email = "andrew@beveridge.uk" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["audio", "sound", "karaoke"]
classifiers = [
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10,!=3.14.1"
dependencies = [
    "audioop-lts>=0.2.1; python_version >= '3.13' and python_version < '4.0'",
    "audioread>=3.1.0",
    "beartype>=0.18.5,<0.19.0",
    "diffq>=0.2; sys_platform != 'win32'",
    "diffq-fixed>=0.2; sys_platform == 'win32'",
    "einops>=0.7",
    "julius>=0.2",
    "librosa>=0.10,<1",
    "ml_collections",
    "numpy>=2",
    "onnx-weekly",
    "onnx2torch-py313>=1.6",
    "packaging",
    "pydub>=0.25",
    "pyyaml",
    "requests>=2",
    "resampy>=0.4",
    "rotary-embedding-torch>=0.6.1,<0.7.0",
    "samplerate==0.1.0",
    "scipy>=1.13.0,<2.0.0",
    "six>=1.16",
    "soundfile>=0.12",
    "torch>=2.13,<3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch>=2.3,<3; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "tqdm",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.17"]
gpu = ["onnxruntime-gpu>=1.17"]
dml = ["onnxruntime-directml>=1.17", "torch_directml"]

[project.scripts]
audio-separator = "audio_separator.utils.cli:main"
audio-separator-remote = "audio_separator.remote.cli:main"

[project.urls]
Homepage = "https://github.com/karaokenerds/python-audio-separator"
Repository = "https://github.com/karaokenerds/python-audio-separator"
Documentation = "https://github.com/karaokenerds/python-audio-separator/blob/main/README.md"

[dependency-groups]
dev = [
    "black>=23",
    "pytest",
    "pytest-cov>=4.1.0",
    "matplotlib>=3.8.0",
    "pillow>=10.1.0",
    "scikit-image>=0.22.0",
    "filetype>=1",
    "google-cloud-firestore>=2.0.0",
    "google-cloud-storage>=2.0.0",
]

[tool.uv]
# PyTorch 2.13 is the measured baseline on Apple Silicon and Linux/CUDA; its
# Apple Silicon wheels target macOS 14 or newer. Preserve upstream's PyTorch
# 2.8 / torchvision 0.23 lock on unvalidated Python <3.14 platforms.
# Python 3.14 needs the first pair with cp314 wheels; torchvision 0.28 excludes
# Python 3.14.1, which is mirrored by the project Python constraint above.
constraint-dependencies = [
    "torch>=2.13,<3; sys_platform == 'linux' or (sys_platform == 'darwin' and platform_machine == 'arm64')",
    "torch>=2.3,<2.9; sys_platform != 'linux' and (sys_platform != 'darwin' or platform_machine != 'arm64') and python_version < '3.14'",
    "torch>=2.13,<3; sys_platform != 'linux' and (sys_platform != 'darwin' or platform_machine != 'arm64') and python_version >= '3.14'",
]

[tool.uv.build-backend]
module-root = ""

[tool.black]
line-length = 140
